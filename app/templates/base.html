<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BSD Bank{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324a; --muted: #52677a; --line: #dce5ed; --page: #f4f7fb; --surface: #fff;
      --brand: #0b2d4d; --accent: #0b5cab; --accent-soft: #e8f1fb;
      --good: #1a7f54; --good-soft: #effaf4; --warn: #8a5a00; --warn-soft: #fff8e6;
      --bad: #8a2018; --bad-soft: #fff0ef;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--page);
    }
    body { margin: 0; background: var(--page); }
    header { background: var(--brand); color: #fff; padding: 1rem max(1rem, calc((100% - 960px)/2)); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    header a { color: #fff; text-decoration: none; }
    .brand { font-size: 1.3rem; font-weight: 700; letter-spacing: .01em; }
    .brand span { opacity: .7; font-weight: 400; margin-left: .4rem; font-size: .95rem; }
    main { box-sizing: border-box; width: min(960px, 100%); margin: 1.5rem auto; padding: 0 1rem 2rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .4rem; }
    h2 { font-size: 1.15rem; margin: 0 0 .6rem; }
    h3 { font-size: .8rem; margin: 0 0 .5rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.4rem; box-shadow: 0 5px 18px #17324a0c; }
    .stack > * + * { margin-top: 1rem; }
    label { display: block; font-weight: 600; margin: 1rem 0 .4rem; }
    input, textarea { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #aebdcc; border-radius: 8px; font: inherit; color: inherit; background: #fff; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    textarea { min-height: 120px; resize: vertical; }
    button, .button { display: inline-block; margin-top: 1rem; background: var(--accent); border: 0; border-radius: 8px; color: #fff; padding: .75rem 1.2rem; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
    button:hover, .button:hover { filter: brightness(1.08); }
    button[disabled] { opacity: .7; cursor: progress; }
    .muted { color: var(--muted); }
    .small { font-size: .875rem; }
    .notice { border-radius: 8px; padding: .8rem 1rem; margin: 1rem 0; background: #edf5fc; }
    .error { background: var(--bad-soft); color: var(--bad); }
    .warning { background: var(--warn-soft); color: var(--warn); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; vertical-align: top; padding: .75rem; border-bottom: 1px solid var(--line); }
    th { background: #eef3f8; }
    td.query { min-width: 260px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .topline { display: flex; justify-content: space-between; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .topline form { margin: 0; }
    .topline button { margin: 0; }
    @media (max-width: 600px) { main { margin-top: 1rem; } .card { padding: 1rem; } h1 { font-size: 1.35rem; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header><a class="brand" href="{{ url_for('customer_home') }}">BSD Bank<span>Customer Support</span></a></header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="notice {{ category }}" role="alert">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
