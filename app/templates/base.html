<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BSD Bank{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #17324a; background: #f4f7fb; }
    body { margin: 0; }
    header { background: #0b2d4d; color: #fff; padding: 1.2rem max(1.25rem, calc((100% - 900px)/2)); }
    header a { color: #fff; text-decoration: none; font-size: 1.35rem; font-weight: 700; }
    main { box-sizing: border-box; width: min(900px, 100%); margin: 2rem auto; padding: 0 1.25rem 2rem; }
    .card { background: #fff; border: 1px solid #dce5ed; border-radius: 12px; padding: 1.4rem; box-shadow: 0 5px 18px #17324a0c; }
    label { display: block; font-weight: 600; margin: 1rem 0 .4rem; }
    input, textarea { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #aebdcc; border-radius: 7px; font: inherit; }
    textarea { min-height: 130px; resize: vertical; }
    button, .button { display: inline-block; margin-top: 1rem; background: #0b5cab; border: 0; border-radius: 7px; color: #fff; padding: .75rem 1.1rem; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
    .muted { color: #52677a; }
    .notice { border-radius: 7px; padding: .8rem 1rem; margin: 1rem 0; background: #edf5fc; }
    .error { background: #fff0ef; color: #8a2018; }
    .warning { background: #fff8e6; color: #684a00; }
    .result { border-left: 4px solid #1a7f54; padding: .7rem 1rem; margin-top: 1.3rem; background: #effaf4; }
    .result h2 { margin: .2rem 0; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; vertical-align: top; padding: .75rem; border-bottom: 1px solid #dce5ed; }
    th { background: #eef3f8; }
    td.query { min-width: 260px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .topline { display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
    .topline form { margin: 0; }
    .topline button { margin: 0; }
    @media (max-width: 600px) { main { margin-top: 1rem; } .card { padding: 1rem; } }
  </style>
</head>
<body>
  <header><a href="{{ url_for('customer_home') }}">BSD Bank</a></header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="notice {{ category }}" role="alert">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
